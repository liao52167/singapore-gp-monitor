name: Singapore GP ticket monitor

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

# The monitor commits its non-sensitive state file after a successful check so
# that the next scheduled run only alerts on a sold-out → available transition.
permissions:
  contents: write

concurrency:
  group: singapore-gp-ticket-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CHECK_INTERVAL_SECONDS: "300"
      HEADLESS: "false"
    steps:
      - name: Check out monitor
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install monitor
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check ticket availability
        run: xvfb-run -a python monitor.py --once

      - name: Save monitor state
        if: success() && hashFiles('state.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "chore: update ticket monitor state"
          git push
